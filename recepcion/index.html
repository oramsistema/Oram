<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Recepción de mercancía</title>
<link rel="manifest" href="manifest-recepcion.json">
<meta name="theme-color" content="#16A34A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F3FBF6; --surface:#FFFFFF; --surface-alt:#EAFBF1;
    --ink:#152A1E; --ink-soft:#5D7368;
    --green-500:#22C55E; --green-600:#16A34A; --green-700:#127A3A; --green-100:#D8F7E4;
    --line:#DFEFE5; --red:#DC2626; --red-bg:#FDECEC; --amber:#B45309; --amber-bg:#FEF3C7;
    --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
    --shadow:0 1px 2px rgba(21,42,30,.06), 0 12px 28px -16px rgba(21,42,30,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1712; --surface:#142019; --surface-alt:#16281F; --ink:#EAF3EC; --ink-soft:#9FB6A8;
      --green-500:#34D399; --green-600:#22C55E; --green-700:#3ADB86; --green-100:#1C3A2A;
      --line:#223226; --red:#F87171; --red-bg:#3B1616; --amber:#FBBF24; --amber-bg:#3A2A0E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1712; --surface:#142019; --surface-alt:#16281F; --ink:#EAF3EC; --ink-soft:#9FB6A8;
    --green-500:#34D399; --green-600:#22C55E; --green-700:#3ADB86; --green-100:#1C3A2A;
    --line:#223226; --red:#F87171; --red-bg:#3B1616; --amber:#FBBF24; --amber-bg:#3A2A0E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  h1,h2{ font-family:'Space Grotesk',sans-serif; margin:0; }
  button,input{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--green-600); outline-offset:2px; }

  .wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:32px; width:100%; max-width:420px; }
  .card h1{ font-size:1.3rem; margin-bottom:6px; text-align:center; }
  .card p.sub{ color:var(--ink-soft); font-size:.88rem; text-align:center; margin:0 0 22px; }
  .form-grid{ display:flex; flex-direction:column; gap:14px; }
  .form-grid label{ display:flex; flex-direction:column; gap:6px; font-size:.85rem; font-weight:600; color:var(--ink-soft); }
  .form-grid input{ padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:1rem; color:var(--ink); background:var(--surface); }
  .form-grid input[readonly]{ background:var(--surface-alt); color:var(--ink-soft); }
  .btn-primary{ background:var(--green-600); color:#fff; border:none; padding:13px 20px; border-radius:var(--radius-sm); font-weight:700; cursor:pointer; font-size:1rem; width:100%; }
  .btn-primary:hover{ background:var(--green-700); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); padding:11px 18px; border-radius:var(--radius-sm); cursor:pointer; font-weight:600; width:100%; }
  .btn-danger{ background:var(--red); color:#fff; border:none; padding:8px 14px; border-radius:var(--radius-sm); cursor:pointer; font-weight:600; font-size:.85rem; }
  .error-text{ color:var(--red); font-size:.85rem; margin-top:10px; }
  .btn-row{ display:flex; gap:10px; }
  .btn-row > *{ flex:1; }

  /* ---------- Pantalla de escaneo ---------- */
  .scan-screen{ position:fixed; inset:0; background:#000; display:flex; flex-direction:column; }
  .scan-topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; color:#fff; }
  .scan-topbar .who{ font-size:.85rem; opacity:.85; }
  .scan-topbar .actions{ display:flex; gap:8px; }
  .scan-exit{ background:rgba(255,255,255,.15); border:none; color:#fff; padding:8px 14px; border-radius:999px; font-size:.82rem; font-weight:600; cursor:pointer; }
  .scan-video{ flex:1; width:100%; object-fit:cover; background:#000; }
  .scan-frame{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:82%; max-width:380px; height:130px; border:3px solid var(--green-500); border-radius:14px; box-shadow:0 0 0 2000px rgba(0,0,0,.4); pointer-events:none; }
  .scan-hint{ position:absolute; bottom:290px; left:0; right:0; text-align:center; color:#fff; font-size:.92rem; }
  .trigger-btn{
    position:absolute; bottom:150px; left:50%; transform:translateX(-50%);
    width:120px; height:120px; border-radius:999px; border:4px solid #fff;
    background:rgba(255,255,255,.15); color:#fff; font-size:.8rem; font-weight:700;
    padding:12px; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .trigger-btn.activo{ background:var(--green-600); border-color:var(--green-500); }
  .block-overlay{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50; }

  /* ---------- Formulario de producto (sobre la cámara) ---------- */
  .product-overlay{ position:fixed; inset:0; background:rgba(10,20,14,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:60; overflow-y:auto; }
  .product-card{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:26px; width:100%; max-width:400px; margin:auto; }
  .product-card h2{ font-size:1.15rem; margin-bottom:16px; }

  /* ---------- Lista capturada ---------- */
  .lista-wrap{ max-width:720px; margin:0 auto; padding:24px; }
  .lista-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .lista-header h1{ font-size:1.2rem; }
  .table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); margin-bottom:20px; }
  .data-table{ width:100%; border-collapse:collapse; min-width:560px; }
  .data-table th{ text-align:left; font-size:.74rem; color:var(--ink-soft); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--surface-alt); }
  .data-table td{ padding:10px 14px; border-bottom:1px solid var(--line); font-size:.87rem; }
  .data-table tr:last-child td{ border-bottom:none; }
  .data-table td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .empty-state{ padding:30px; text-align:center; color:var(--ink-soft); }
  #toastRoot{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:200; }
  .toast{ background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:999px; font-size:.9rem; font-weight:600; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); }
  .toast-success{ background:var(--green-700); color:#fff; }
  .toast-warn{ background:var(--amber); color:#fff; }
  .toast-error{ background:var(--red); color:#fff; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toastRoot" aria-live="polite"></div>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw-recepcion.js').catch(()=>{}); });
  }
  const BARCODE_FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','codabar','itf'];

  let etiquetaLote = '';
  let capturados = cargarCapturados();
  let scannerStream = null;
  let pantallaEscaneoActiva = false;
  let scannerLoopId = null;
  let scannerDetector = null;
  let disparadorActivo = false;
  let escaneandoPausado = false;
  const PAUSA_DESPUES_DE_ESCANEAR = 1200;
  let audioCtx = null;

  function escapeHTML(str){
    return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function formatMoney(n){
    return '$' + (Number(n)||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function barcodeSoportado(){ return 'BarcodeDetector' in window; }
  function esNavegadorEnApp(){
    const ua = navigator.userAgent || '';
    return /\bWhatsApp\b|FBAN|FBAV|Instagram|Line\/|MicroMessenger|Twitter/i.test(ua);
  }
  function renderAbrirEnChrome(){
    document.getElementById('app').innerHTML = `
      <div class="wrap"><div class="card">
        <h1>Abre esto en Chrome</h1>
        <p class="sub">Estás viendo esta página dentro de otra app (como WhatsApp), y por seguridad no te va a dejar usar la cámara ahí.</p>
        <p class="sub">Toca los tres puntos (⋮) arriba y elige "Abrir en Chrome", o copia este link y pégalo directo en Chrome.</p>
      </div></div>`;
  }
  let toastTimer = null;
  function showToast(message, type){
    const root = document.getElementById('toastRoot');
    root.innerHTML = `<div class="toast toast-${type||'info'}">${escapeHTML(message)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 3200);
  }

  // -------------------------------------------------- Persistencia local
  function cargarCapturados(){
    try{ const raw = localStorage.getItem('recepcionCapturados'); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
  }
  function guardarCapturados(){
    try{ localStorage.setItem('recepcionCapturados', JSON.stringify(capturados)); }catch(e){ /* se ignora */ }
  }

  // ------------------------------------------------------------- Pantalla 1
  function renderInicio(){
    document.getElementById('app').innerHTML = `
      <div class="wrap"><div class="card">
        <h1>Recepción de mercancía</h1>
        <p class="sub">Escanea cada producto que te llegue y captura sus datos. Al final descargas un Excel listo para cargarlo en Administración.</p>
        <form id="inicioForm" class="form-grid">
          <label>Nombre del negocio o entrega (para nombrar el archivo, opcional)<input name="etiqueta" type="text" placeholder="Ej. Refaccionaria Torres - 24 sep" value="${escapeHTML(etiquetaLote)}" /></label>
          <button type="submit" class="btn-primary">Comenzar a escanear</button>
          ${capturados.length ? `<button type="button" class="btn-ghost" id="verListaBtn0">Ver lista guardada (${capturados.length})</button>` : ''}
        </form>
      </div></div>`;
    document.getElementById('inicioForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      etiquetaLote = e.target.etiqueta.value.trim();
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
      }catch(err){ /* audio no disponible: se ignora */ }
      iniciarEscaneo();
    });
    const verListaBtn0 = document.getElementById('verListaBtn0');
    if(verListaBtn0) verListaBtn0.addEventListener('click', renderLista);
  }

  // ------------------------------------------------------------- Pantalla 2
  function iniciarEscaneo(){
    // Si ya había una cámara abierta de antes (por ejemplo, al volver a armar
    // esta pantalla después de guardar un producto), suéltala primero — si no,
    // se van acumulando conexiones a la cámara sin cerrar.
    if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
    escaneandoPausado = false;
    disparadorActivo = false;
    document.getElementById('app').innerHTML = `
      <div class="scan-screen">
        <div class="scan-topbar">
          <span class="who">${capturados.length} producto(s) capturado(s)</span>
          <div class="actions">
            <button type="button" class="scan-exit" id="verListaBtn">Ver lista</button>
            <button type="button" class="scan-exit" id="salirBtn">Salir</button>
          </div>
        </div>
        <video id="scanVideo" class="scan-video" autoplay playsinline muted></video>
        <div class="scan-frame"></div>
        <p class="scan-hint">Apunta la cámara, luego mantén presionado el botón</p>
        <button type="button" id="triggerBtn" class="trigger-btn">Mantén presionado para leer</button>
      </div>`;
    document.getElementById('salirBtn').addEventListener('click', ()=>{ detenerCamara(); renderInicio(); });
    document.getElementById('verListaBtn').addEventListener('click', ()=>{ detenerCamara(); renderLista(); });
    const triggerBtn = document.getElementById('triggerBtn');
    const activarDisparador = async (e)=>{
      e.preventDefault();
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
      }catch(err){ /* se ignora */ }
      await asegurarCamaraViva();
      disparadorActivo = true; triggerBtn.classList.add('activo'); scannerLoop();
    };
    const desactivarDisparador = ()=>{ disparadorActivo = false; triggerBtn.classList.remove('activo'); };
    triggerBtn.addEventListener('pointerdown', activarDisparador);
    triggerBtn.addEventListener('pointerup', desactivarDisparador);
    triggerBtn.addEventListener('pointercancel', desactivarDisparador);
    triggerBtn.addEventListener('pointerleave', desactivarDisparador);

    if(!barcodeSoportado()){
      document.getElementById('app').innerHTML = `
        <div class="block-overlay"><div class="card">
          <h1>No compatible</h1>
          <p class="sub">Tu navegador no soporta lectura de códigos de barra. Usa Chrome en un teléfono Android.</p>
          <button type="button" class="btn-primary" id="volverBtn">Volver</button>
        </div></div>`;
      document.getElementById('volverBtn').addEventListener('click', renderInicio);
      return;
    }

    pantallaEscaneoActiva = true;
    abrirCamara();
  }

  async function asegurarCamaraViva(){
    const track = scannerStream ? scannerStream.getVideoTracks()[0] : null;
    if(track && track.readyState === 'live'){ return; }
    if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      scannerStream = stream;
      const video = document.getElementById('scanVideo');
      if(video){ video.srcObject = stream; }
      if(!scannerDetector){ scannerDetector = new window.BarcodeDetector({ formats: BARCODE_FORMATS }); }
    }catch(err){ /* si falla, se reintentará en el siguiente intento de escaneo */ }
  }

  function abrirCamara(){
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } })
      .then(stream=>{
        scannerStream = stream;
        const video = document.getElementById('scanVideo');
        if(!video){ stream.getTracks().forEach(t=>t.stop()); return; }
        video.srcObject = stream;
        scannerDetector = new window.BarcodeDetector({ formats: BARCODE_FORMATS });
      })
      .catch((err)=>{
        const detalle = err ? ((err.name||'Error') + (err.message ? ': '+err.message : '')) : 'Error desconocido';
        document.getElementById('app').innerHTML = `
          <div class="block-overlay"><div class="card">
            <h1>No se pudo abrir la cámara</h1>
            <p class="sub">${escapeHTML(detalle)}</p>
            <button type="button" class="btn-primary" id="volverBtnCam">Volver</button>
          </div></div>`;
        document.getElementById('volverBtnCam').addEventListener('click', renderInicio);
      });
  }

  document.addEventListener('visibilitychange', ()=>{
    if(!pantallaEscaneoActiva) return;
    if(document.visibilityState === 'hidden'){
      if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
      scannerDetector = null;
    }else if(document.visibilityState === 'visible'){
      if(!scannerStream && document.getElementById('scanVideo')){ abrirCamara(); }
    }
  });

  async function scannerLoop(){
    if(!disparadorActivo) return;
    const video = document.getElementById('scanVideo');
    if(!video || !scannerDetector) return;
    if(!escaneandoPausado){
      try{
        const codigos = await scannerDetector.detect(video);
        if(codigos && codigos.length){
          const valor = codigos[0].rawValue;
          if(valor){
            reproducirBeep();
            escaneandoPausado = true;
            disparadorActivo = false;
            const triggerBtn = document.getElementById('triggerBtn');
            if(triggerBtn) triggerBtn.classList.remove('activo');
            abrirFormularioProducto(valor);
            setTimeout(()=>{ escaneandoPausado = false; }, PAUSA_DESPUES_DE_ESCANEAR);
          }
        }
      }catch(e){ /* frame no listo: seguir intentando */ }
    }
    if(scannerStream && disparadorActivo){ scannerLoopId = requestAnimationFrame(scannerLoop); }
  }

  function reproducirBeep(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 1800;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }catch(e){ /* audio no disponible: se ignora */ }
  }

  function detenerCamara(){
    pantallaEscaneoActiva = false;
    if(scannerLoopId){ cancelAnimationFrame(scannerLoopId); scannerLoopId = null; }
    if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
    scannerDetector = null;
  }

  // ------------------------------------------------------- Formulario
  function abrirFormularioProducto(codigo, valoresPrevios){
    const v = valoresPrevios || { nombre:'', categoria:'', cantidad:'', costo:'', precioVenta:'' };
    document.getElementById('app').insertAdjacentHTML('beforeend', `
      <div class="product-overlay" id="productOverlay">
        <div class="product-card">
          <h2>Producto escaneado</h2>
          <form id="productoForm" class="form-grid">
            <label>Código de barras<input readonly value="${escapeHTML(codigo)}" /></label>
            <label>Nombre del producto*<input required name="nombre" type="text" value="${escapeHTML(v.nombre)}" autofocus /></label>
            <label>Categoría (opcional)<input name="categoria" type="text" value="${escapeHTML(v.categoria)}" /></label>
            <label>Cantidad*<input required name="cantidad" type="number" min="1" step="1" value="${escapeHTML(v.cantidad)}" /></label>
            <label>Precio de compra*<input required name="costo" type="number" min="0" step="0.01" value="${escapeHTML(v.costo)}" /></label>
            <label>Precio de venta*<input required name="precioVenta" type="number" min="0" step="0.01" value="${escapeHTML(v.precioVenta)}" /></label>
          </form>
          <p class="error-text" id="productoError" style="display:none;"></p>
          <div class="btn-row" style="margin-top:16px;">
            <button type="button" class="btn-ghost" id="cancelarProductoBtn">Cancelar</button>
            <button type="button" class="btn-primary" id="guardarProductoBtn">Guardar</button>
          </div>
        </div>
      </div>`);
    document.getElementById('cancelarProductoBtn').addEventListener('click', ()=>{
      document.getElementById('productOverlay').remove();
    });
    document.getElementById('guardarProductoBtn').addEventListener('click', ()=> guardarProducto(codigo));
  }

  function guardarProducto(codigo){
    const form = document.getElementById('productoForm');
    const errorEl = document.getElementById('productoError');
    const nombre = form.nombre.value.trim();
    const categoria = form.categoria.value.trim();
    const cantidad = Number(form.cantidad.value);
    const costo = Number(form.costo.value);
    const precioVenta = Number(form.precioVenta.value);
    errorEl.style.display = 'none';
    if(!nombre || !(cantidad>0) || isNaN(costo) || isNaN(precioVenta)){
      errorEl.textContent = 'Completa todos los campos obligatorios.';
      errorEl.style.display = 'block';
      return;
    }
    const nombreNormalizado = nombre.toLowerCase();
    const yaExiste = capturados.some(it => it.nombre.trim().toLowerCase() === nombreNormalizado);
    if(yaExiste){
      errorEl.textContent = 'Ya registraste un producto con ese nombre en esta sesión (con otro código). Modifica el nombre — por ejemplo, agrega el lote o una característica — para poder diferenciarlos después en el buscador.';
      errorEl.style.display = 'block';
      return;
    }
    capturados.push({ codigo, nombre, categoria, cantidad, costo, precioVenta });
    guardarCapturados();
    document.getElementById('productOverlay').remove();
    showToast(`${nombre} guardado.`, 'success');
    iniciarEscaneo();
  }

  // ------------------------------------------------------- Lista capturada
  function renderLista(){
    const filas = capturados.map((it, idx)=>`
      <tr>
        <td class="mono" style="font-family:ui-monospace,monospace;">${escapeHTML(it.codigo)}</td>
        <td>${escapeHTML(it.nombre)}</td>
        <td>${escapeHTML(it.categoria||'—')}</td>
        <td class="num">${it.cantidad}</td>
        <td class="num">${formatMoney(it.costo)}</td>
        <td class="num">${formatMoney(it.precioVenta)}</td>
        <td><button type="button" class="btn-danger" data-idx="${idx}">Eliminar</button></td>
      </tr>`).join('');
    document.getElementById('app').innerHTML = `
      <div class="lista-wrap">
        <div class="lista-header">
          <h1>Productos capturados (${capturados.length})</h1>
          <button type="button" class="btn-ghost" id="volverEscanearBtn" style="width:auto;">← Seguir escaneando</button>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th class="num">Cant.</th><th class="num">Compra</th><th class="num">Venta</th><th></th></tr></thead>
            <tbody>${filas || '<tr><td colspan="7"><div class="empty-state">Aún no has escaneado ningún producto.</div></td></tr>'}</tbody>
          </table>
        </div>
        <div class="btn-row">
          <button type="button" class="btn-ghost" id="vaciarListaBtn">Vaciar lista</button>
          <button type="button" class="btn-primary" id="descargarExcelBtn">Descargar Excel</button>
        </div>
      </div>`;
    document.getElementById('volverEscanearBtn').addEventListener('click', iniciarEscaneo);
    document.getElementById('descargarExcelBtn').addEventListener('click', descargarExcel);
    const vaciarBtn = document.getElementById('vaciarListaBtn');
    let confirmandoVaciar = false;
    vaciarBtn.addEventListener('click', ()=>{
      if(!confirmandoVaciar){
        confirmandoVaciar = true;
        vaciarBtn.textContent = '¿Seguro? Toca de nuevo';
        setTimeout(()=>{ confirmandoVaciar = false; vaciarBtn.textContent = 'Vaciar lista'; }, 3000);
        return;
      }
      capturados = [];
      guardarCapturados();
      renderLista();
      showToast('Lista vaciada.', 'success');
    });
    document.querySelectorAll('[data-idx]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        capturados.splice(Number(btn.dataset.idx), 1);
        guardarCapturados();
        renderLista();
      });
    });
  }

  function descargarExcel(){
    if(!capturados.length){ showToast('No hay productos para exportar.', 'warn'); return; }
    if(typeof XLSX === 'undefined'){ showToast('No se pudo cargar el generador de Excel.', 'error'); return; }
    const datos = [['Nombre','Categoría','SKU','Precio','Costo','Existencia','Stock mínimo']];
    capturados.forEach(it=>{
      datos.push([it.nombre, it.categoria||'General', it.codigo, it.precioVenta, it.costo, it.cantidad, '']);
    });
    const ws = XLSX.utils.aoa_to_sheet(datos);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Recepción');
    const nombreArchivo = 'recepcion_' + (etiquetaLote ? etiquetaLote.replace(/[^a-z0-9]+/gi,'_') + '_' : '') + new Date().toLocaleDateString('en-CA') + '.xlsx';
    XLSX.writeFile(wb, nombreArchivo);
    showToast('Excel descargado.', 'success');
  }

  // ------------------------------------------------------------- Arranque
  if(esNavegadorEnApp()){
    renderAbrirEnChrome();
  }else{
    renderInicio();
  }
</script>
</body>
</html>
